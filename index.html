<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050a12">
  <meta name="description" content="3903 | The Citadel — More Than a Kingdom. Explore ROK BattleTrack.">
  <title>3903 | The Citadel — More Than a Kingdom</title>
  <style>
    :root { color-scheme: dark; background: #050a12; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse 80% 44% at 50% 12%, #101d31 0%, #070e19 55%, #050a12 100%); color: #f5e7c4; }
    main { width: min(100% - 32px, 1180px); margin-inline: auto; padding: clamp(20px, 4vw, 54px) 0 80px; }
    .brand { display: flex; align-items: center; justify-content: center; margin: 0 auto clamp(28px, 4vw, 52px); }
    .logo { display: block; width: min(100%, 1060px); height: auto; object-fit: contain; }
    .battletrack { position: relative; isolation: isolate; display: flex; align-items: center; overflow: hidden; min-height: clamp(255px, 29vw, 340px); border: 1px solid #b88738; border-radius: 13px; background: #071426 url('./assets/battletrack-card.png') center / cover no-repeat; box-shadow: 0 14px 45px #0009, inset 0 0 0 2px #04070b; }
    .battletrack::before { content: ''; position: absolute; z-index: -1; inset: 0; background: linear-gradient(90deg, rgba(3,9,20,.83) 0%, rgba(3,9,20,.62) 39%, rgba(3,9,20,.10) 76%); }
    .card-content { width: min(100%, 570px); padding: clamp(24px, 5vw, 58px); }
    .eyebrow { margin: 0 0 10px; font-size: .72rem; font-weight: 700; letter-spacing: .23em; color: #e0b965; text-transform: uppercase; }
    h1 { margin: 0 0 12px; color: #f8dfa0; font: 700 clamp(1.7rem, 3.7vw, 3.2rem)/1.1 Georgia, 'Times New Roman', serif; text-shadow: 0 2px 9px #000b; }
    .description { margin: 0 0 25px; max-width: 37ch; color: #e1e4ed; font-size: clamp(.9rem, 1.5vw, 1.05rem); line-height: 1.6; text-shadow: 0 2px 5px #000c; }
    .cta { display: inline-flex; gap: 18px; align-items: center; justify-content: center; min-height: 46px; padding: 12px 22px; border-radius: 7px; background: linear-gradient(180deg, #f8d987, #d39a36); border: 1px solid #f8dd9a; box-shadow: 0 4px 14px #0008; color: #201607; font-size: .82rem; font-weight: 800; letter-spacing: .06em; text-decoration: none; transition: filter .2s ease, transform .2s ease; }
    .cta:hover { filter: brightness(1.1); transform: translateY(-2px); }
    .cta:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    @media (max-width: 600px) {
      main { width: min(100% - 24px, 480px); padding-top: 24px; padding-bottom: 45px; }
      .brand { margin-bottom: 26px; }
      .battletrack { min-height: 335px; align-items: flex-end; background-position: 60% center; }
      .battletrack::before { background: linear-gradient(0deg, rgba(3,9,20,.96) 0%, rgba(3,9,20,.88) 40%, rgba(3,9,20,.26) 100%); }
      .card-content { padding: 22px 20px 25px; }
      .eyebrow { font-size: .65rem; }
      h1 { font-size: clamp(1.75rem, 8vw, 2.2rem); }
      .description { font-size: .92rem; margin-bottom: 19px; }
      .cta { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .cta { transition: none; } }
  </style>
</head>
<body>
  <main>
    <header class="brand"><img class="logo" src="./assets/citadel-logo.png" alt="3903 The Citadel — The Heart of the Kingdom. More Than a Kingdom." width="1946" height="808" fetchpriority="high"></header>
    <section class="battletrack" aria-labelledby="battletrack-title">
      <div class="card-content">
        <p class="eyebrow">Kingdom 3903 · Royal Tools</p>
        <h1 id="battletrack-title">ROK BattleTrack</h1>
        <p class="description">Track your battles, kill points, dead troops and kingdom performance — all in one place.</p>
        <a class="cta" href="https://battletrack.kingdom3903.com/">OPEN BATTLETRACK <span aria-hidden="true">→</span></a>
      </div>
    </section>
  </main>
</body>
</html>
