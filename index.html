<title>3903 | The Citadel — More Than a Kingdom</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#050a12}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse 85% 48% at 50% 12%,#111b29 0%,#070e19 59%,#050a12 100%);background-color:#050a12;color:#f5e7c4}main{width:min(100% - 32px,1180px);margin:auto;padding:clamp(20px,4vw,54px) 0 80px}.brand{display:flex;justify-content:center;position:relative;isolation:isolate;margin:0 auto clamp(24px,3vw,40px)}.brand::before{content:"";position:absolute;z-index:-1;pointer-events:none;left:50%;top:43%;transform:translate(-50%,-50%);width:clamp(360px,112%,1320px);height:135%;background:radial-gradient(ellipse 45% 40% at 50% 46%,rgba(241,161,42,.49) 0%,rgba(211,126,26,.35) 28%,rgba(137,77,21,.19) 51%,rgba(75,43,17,.07) 70%,transparent 100%);filter:blur(clamp(30px,5vw,75px))}.logo{display:block;position:relative;width:min(100%,1060px);height:auto}.tool-grid{display:flex;justify-content:center}.battletrack{display:block;position:relative;width:min(100%,850px);border:0;border-radius:0;overflow:visible;background:transparent;box-shadow:none;text-decoration:none;color:inherit;transition:transform .2s ease,filter .2s ease}.battletrack:hover{transform:translateY(-3px);filter:brightness(1.04)}.battletrack:focus-visible{outline:3px solid #ffe3a2;outline-offset:5px}.battletrack-art{display:block;width:100%;height:auto}@media(max-width:600px){body{background:radial-gradient(ellipse 100% 40% at 50% 12%,#111b29 0%,#070e19 62%,#050a12 100%);background-color:#050a12}main{width:min(100% - 24px,480px);padding-top:22px}.brand{margin-bottom:24px}.brand::before{width:130%;height:145%;top:43%;background:radial-gradient(ellipse 48% 40% at 50% 45%,rgba(239,156,42,.50) 0%,rgba(202,115,26,.34) 34%,rgba(115,66,22,.15) 65%,transparent 100%);filter:blur(34px)}.battletrack{max-width:440px}.battletrack-art{width:100%;height:auto;object-fit:contain}}@media(prefers-reduced-motion:reduce){.battletrack{transition:none}}

/* Royal secondary cards — image is the entire interactive card, no duplicate border or text */
.secondary-grid{width:min(100%,850px);margin:clamp(8px,1.8vw,20px) auto 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,1.5vw,16px);align-items:start}
.secondary-card{display:block;position:relative;min-width:0;text-decoration:none;background:transparent;border:0;border-radius:0;box-shadow:none;transition:transform .2s ease,filter .2s ease}
.secondary-card:hover{transform:translateY(-3px);filter:brightness(1.08)}
.secondary-card:focus-visible{outline:3px solid #ffe3a2;outline-offset:3px}
.secondary-card img{display:block;width:100%;height:auto;object-fit:contain}
@media(max-width:600px){.secondary-grid{grid-template-columns:minmax(0,1fr);gap:clamp(8px,2vw,14px);margin-top:clamp(12px,3vw,20px);justify-items:center}.secondary-card{width:min(76vw,350px);max-width:100%;margin-inline:auto}.secondary-card img{width:100%;height:auto;object-fit:contain}}
@media(prefers-reduced-motion:reduce){.secondary-card{transition:none}}

/* Shared Kingdom 3903 footer */
.citadel-footer{position:relative;isolation:isolate;max-width:1050px;margin:clamp(58px,8vw,110px) auto 0;min-height:245px;display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,1.25fr) minmax(0,1fr);align-items:center;gap:0;text-align:center;color:#e8c47e}
.citadel-footer::before{content:"";position:absolute;inset:15% 10%;z-index:-1;background:radial-gradient(ellipse at 50% 65%,rgba(24,38,59,.48),transparent 68%);pointer-events:none}
.footer-cappy{width:100%;max-height:265px;object-fit:contain;display:block;filter:drop-shadow(0 0 8px rgba(159,100,29,.1))}
.footer-center{min-width:0;padding:12px 4px 20px}
.footer-divider{height:1px;max-width:260px;margin:0 auto 17px;background:linear-gradient(90deg,transparent,#92713b 30%,#d3a657 50%,#92713b 70%,transparent)}
.footer-motto{font-family:Georgia,'Times New Roman',serif;font-size:clamp(14px,1.8vw,22px);font-weight:600;letter-spacing:.055em;line-height:1.5;color:#e6bc68;text-shadow:0 1px 10px rgba(190,117,28,.14);margin:0}
.footer-heart{font-family:system-ui,sans-serif;font-size:.85em;white-space:nowrap}
.footer-note{max-width:420px;margin:16px auto 0;color:#9ca5b4;font-size:clamp(10px,1.05vw,12px);line-height:1.65}
.footer-bottom{height:1px;max-width:310px;margin:20px auto 0;background:linear-gradient(90deg,transparent,#765a2d,transparent)}
@media(max-width:600px){main{padding-bottom:35px}.citadel-footer{margin-top:55px;grid-template-columns:minmax(0,1fr) minmax(175px,1.7fr) minmax(0,1fr);min-height:170px}.footer-cappy{max-height:175px}.footer-center{padding:8px 0}.footer-motto{font-size:clamp(12px,3.25vw,16px);letter-spacing:0;line-height:1.5}.footer-note{font-size:10px;line-height:1.5;margin-top:12px}.footer-divider{margin-bottom:10px}.footer-bottom{margin-top:12px}}
@media(max-width:380px){.citadel-footer{grid-template-columns:1fr 2.3fr 1fr}.footer-cappy{max-height:135px}.footer-motto{font-size:12px}}
</style>
