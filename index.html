<style>

/* Royal secondary cards — image is the entire interactive card, no duplicate border or text */
.secondary-grid{width:min(100%,850px);margin:clamp(8px,1.8vw,20px) auto 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,1.5vw,16px);align-items:start}

.citadel-footer{position:relative;isolation:isolate;max-width:1050px;margin:clamp(58px,8vw,110px) auto 0;min-height:245px;display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,1.25fr) minmax(0,1fr);align-items:center;gap:0;text-align:center;color:#e8c47e}

.hero-layout{position:relative;display:flex;align-items:center;min-height:clamp(310px,29vw,520px);overflow:hidden;isolation:isolate;border:0;padding:clamp(18px,3.5vw,54px)}
