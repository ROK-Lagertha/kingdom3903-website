<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050a12">
  <meta name="description" content="3903 | The Citadel — The Heart of the Kingdom.">
  <title>3903 | The Citadel</title>
  <style>
    :root { color-scheme: dark; background: #050a12; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { min-height: 100vh; min-height: 100dvh; background: radial-gradient(ellipse 72% 56% at 50% 46%, #0d1828 0%, #070e19 48%, #050a12 100%); }
    main { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: clamp(16px, 4vw, 64px); }
    .logo { display: block; width: min(100%, 1320px); height: auto; max-height: 85dvh; object-fit: contain; }
    @media (max-width: 600px) { main { padding: 12px; } .logo { width: 100%; max-height: 75dvh; } }
  </style>
</head>
<body>
  <main><img class="logo" src="./assets/citadel-logo.png" alt="3903 The Citadel — The Heart of the Kingdom" width="1945" height="809" fetchpriority="high"></main>
</body>
</html>
