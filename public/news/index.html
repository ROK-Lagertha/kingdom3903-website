<script>
(async()=>{try{const r=await fetch('/api/herald/me',{credentials:'same-origin',cache:'no-store'});if(!r.ok)return;const d=await r.json();if(d.authenticated===true&&d.isAdmin===true){const b=document.getElementById('login');b.setAttribute('aria-label','Open Reporter Dashboard');b.setAttribute('title','Open Reporter Dashboard');b.dataset.auth='yes';}}catch{}})();
document.getElementById('login').addEventListener('click',()=>{location.href=document.getElementById('login').dataset.auth==='yes'?'/news/admin/':'/api/herald/login'});
(async()=>{try{const r=await fetch('/api/herald/public/articles');if(!r.ok)throw Error('News service unavailable');const data=await r.json();const wrap=document.getElementById('live-articles');wrap.replaceChildren();if(!data.articles?.length){const empty=document.createElement('p');empty.className='news-status';empty.textContent='No news has been published yet. Check back soon!';wrap.append(empty);return}const articles=[...data.articles].sort((a,b)=>new Date(b.published_at)-new Date(a.published_at));for(const a of articles){const card=document.createElement('article');card.className='article';const crown=document.createElement('span');crown.className='frame-crown';crown.textContent='👑';const top=document.createElement('span');top.className='jewel jewel-top';const bottom=document.createElement('span');bottom.className='jewel jewel-bottom';const cat=document.createElement('span');cat.className='category';cat.textContent=a.category;const date=document.createElement('time');date.textContent=new Date(a.published_at).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});const title=document.createElement('h3');title.textContent=a.title;const summary=document.createElement('p');summary.textContent=a.summary;const link=document.createElement('a');link.href='/news/'+encodeURIComponent(a.slug);link.textContent='READ DISPATCH ↗';link.onclick=e=>{e.preventDefault();showHerald(a.id,a.slug,true)};card.append(crown,top,bottom,cat,date,title,summary,link);wrap.append(card)}}catch(e){console.warn('Royal Herald live feed unavailable',e);document.getElementById('live-articles').textContent='News is temporarily unavailable. Please try again shortly.'}})();
async function showHerald(id,slug,updateHistory=false){try{const r=await fetch('/api/herald/public/articles/'+id);if(!r.ok)throw Error('Article unavailable');const {article:a}=await r.json();const box=document.getElementById('herald-article-content');box.replaceChildren();const heading=document.createElement('h2');heading.textContent=a.title;const meta=document.createElement('p');meta.className='date';meta.textContent=a.category+' · '+new Date(a.published_at).toLocaleDateString('en-GB');const body=document.createElement('div');body.className='herald-safe-content';body.innerHTML=a.body_html;box.append(heading,meta);const share=document.createElement('button');share.type='button';share.textContent='COPY ARTICLE LINK ↗';share.style.cssText='margin:4px 0 16px;background:#142840;color:#f2d18b;border:1px solid #c18b39;border-radius:5px;padding:9px 13px;cursor:pointer;font-weight:700;letter-spacing:.06em';share.onclick=async()=>{const articleUrl=location.origin+'/news/'+encodeURIComponent(a.slug);try{await navigator.clipboard.writeText(articleUrl);share.textContent='LINK COPIED ✓'}catch{prompt('Copy article link:',articleUrl)}};box.append(share);if(a.has_image){const image=document.createElement('img');image.src='/api/herald/images/'+encodeURIComponent(a.id);image.alt='Illustration for '+a.title;image.loading='eager';image.style.cssText='display:block;width:100%;max-height:500px;object-fit:contain;border-radius:8px;border:1px solid #987443;margin:18px 0 24px';box.append(image)}box.append(body);if(updateHistory&&a.slug)history.pushState({heraldArticle:a.slug},'', '/news/'+encodeURIComponent(a.slug));document.getElementById('herald-article-modal').hidden=false;document.body.style.overflow='hidden'}catch(e){alert(e.message)}}
function closeHerald(updateHistory=true){document.getElementById('herald-article-modal').hidden=true;document.body.style.overflow='';if(updateHistory&&location.pathname!='/news/'&&location.pathname!='/news')history.pushState({},'','/news/')}
document.getElementById('close-herald').onclick=()=>closeHerald();
window.addEventListener('popstate',()=>{const slug=decodeURIComponent(location.pathname.match(/^\/news\/([a-z0-9-]+)\/?$/)?.[1]||'');if(!slug){closeHerald(false);return}openSlug(slug)});
async function openSlug(slug){try{const r=await fetch('/api/herald/public/articles',{cache:'no-store'});if(!r.ok)throw Error('Could not load articles');const data=await r.json();const article=data.articles?.find(a=>a.slug===slug);if(article)await showHerald(article.id,article.slug,false);else alert('This article is not available.')}catch(e){console.warn('Unable to open direct article link',e)}}
const directSlug=location.pathname.match(/^\/news\/([a-z0-9-]+)\/?$/)?.[1];if(directSlug)openSlug(directSlug);

</script></body></html>
